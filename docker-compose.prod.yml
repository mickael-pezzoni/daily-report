# Single-container deployment: the API also serves the built web app.
# Run with both variable files: this one for substitution within this
# compose file (POSTGRES_PASSWORD…), the other (implicit, `env_file`) for
# variables injected as-is into the api container.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# See .env.prod.example for the full list of variables to fill in.
#
# ⚠️ `name:` pins the Compose project name. Without it, the default name
# comes from the directory (« daily-report ») — the same as
# docker-compose.yml (dev), and the same as any other directory sharing
# that name on the machine. Two Compose projects with the same name share
# container names: the second `up` recreates the first one's containers.
name: daily-report-prod

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Computed here rather than in .env.prod, so each value exists in only
      # one place: the Postgres password, the single public URL (web and
      # api share the same origin in this image), and the auth secret under
      # a generic name (AUTH_SECRET) rather than the more technical one
      # expected by better-auth.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/daily_report
      BETTER_AUTH_URL: ${PUBLIC_URL}
      WEB_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${AUTH_SECRET}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: daily_report
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_report"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
  uploads:
